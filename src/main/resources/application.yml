spring:
  application:
    name: educfin-ai

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/educfin}
    username: ${DB_USERNAME:educfin}
    password: ${DB_PASSWORD:educfin}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
    issuer: ${JWT_ISSUER:educfin-ai}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
